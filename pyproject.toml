[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpumesh"
version = "1.2.0"
description = "Borrow your friends' GPUs: a terminal-based distributed compute mesh in pure Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
keywords = ["gpu", "distributed", "compute", "mesh", "ml", "pytorch", "cuda"]

dependencies = [
    "cloudpickle",
]

[project.urls]
Homepage = "https://github.com/Samurai007AK/gpumesh"
Documentation = "https://github.com/Samurai007AK/gpumesh#readme"
Repository = "https://github.com/Samurai007AK/gpumesh"
Issues = "https://github.com/Samurai007AK/gpumesh/issues"

[project.optional-dependencies]
gpu = ["torch"]
tunnel = ["pyngrok"]
sysinfo = ["psutil"]
notebook = ["pandas"]
ui = ["rich", "questionary"]
dev = ["pytest", "build", "twine"]
all = ["gpumesh[gpu,tunnel,sysinfo,notebook,ui]"]

[project.scripts]
gpumesh = "gpumesh.cli:main"

[tool.setuptools.packages.find]
include = ["gpumesh*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
# Almost every test here starts a real server, worker, or subprocess, so the
# way this suite fails is by blocking rather than by asserting. Without a cap
# a single stuck test consumes the whole CI job budget and the log ends
# mid-progress with nothing to go on. This dumps every thread's stack and
# aborts instead. The slowest legitimate test takes ~21s, so 300s only ever
# fires on a genuine hang.
faulthandler_timeout = 300
