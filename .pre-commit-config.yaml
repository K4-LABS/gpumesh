# Local pre-commit hooks.
#
#     pip install pre-commit && pre-commit install
#
# Deliberately NOT a formatter. `ruff format` (or Black) over this repo would
# touch nearly every file, and a formatting sweep is the single most effective
# way to turn every open branch into a merge conflict. The hooks below either
# only run on files you are actually committing, or only report.
#
# To run the whole set once over everything, on purpose:
#     pre-commit run --all-files
#
# Note on `rev`: pre-commit clones each repo and checks out `rev`, so a tag
# here has the same mutability problem as a tag in a GitHub Actions workflow.
# The blast radius is much smaller — these run on a developer laptop, not on a
# runner holding a publish credential — but `rev` accepts a full SHA if you
# want the stronger pin. `pre-commit autoupdate` will rewrite it back to a tag.

default_language_version:
  python: python3

# Generated/vendored paths that no hook should touch.
exclude: |
  (?x)^(
      \.agents/|
      \.claude/|
      \.continue/|
      \.forge/|
      skills-lock\.json|
      .*\.egg-info/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # -- Hygiene, staged files only ------------------------------------
      - id: trailing-whitespace
        # Markdown uses two trailing spaces as a hard line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict

      # -- Correctness of the files this repo's CI depends on -------------
      - id: check-yaml
        # A workflow that does not parse is a workflow that silently does not
        # run. GitHub does not tell you loudly.
        files: ^(\.github/.*\.ya?ml|docker-compose.*\.ya?ml|\.pre-commit-config\.yaml)$
      - id: check-toml
      - id: check-json

      # -- Things that should never reach a commit -----------------------
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
        # This repo has a specific history here: HANDOFF.md and
        # worker_fix.bat are gitignored precisely because they carry a live
        # coordinator token and SSH credentials for a second machine. A
        # gitignore protects against `git add .`; it does not protect against
        # `git add -f` or against someone pasting the same material into a
        # different file. This hook is the second line.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

      # -- Python-specific ------------------------------------------------
      - id: debug-statements
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Reports only. No `--fix`, and no `ruff-format` hook, for the reason
      # at the top of this file. Configuration lives in [tool.ruff] in
      # pyproject.toml so the hook, CI, and your editor all agree.
      - id: ruff
        name: ruff (report only, no autofix)
        args: [--no-fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged diff for credential-shaped strings. Complements
      # detect-private-key above, which only knows about PEM key blocks and
      # would not recognise a gpumesh coordinator token.
      - id: gitleaks
