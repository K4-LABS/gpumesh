services:
  coordinator:
    build: .
    ports:
      - "${GPUMESH_PORT:-8732}:8732"
      - "48900:48900/udp"
    environment:
      - GPUMESH_COLOR=1
    # `gpumesh serve` does not read GPUMESH_TOKEN from the environment (unlike
    # `join`), so the token must be passed explicitly — without it the
    # coordinator generates a random one and no worker can ever authenticate.
    # `:?` fails the run with a readable message instead of starting a mesh
    # whose workers are guaranteed to be rejected.
    command: serve --port 8732 --color --token ${GPUMESH_TOKEN:?set GPUMESH_TOKEN, e.g. GPUMESH_TOKEN=mysecret docker compose up -d}
    volumes:
      - gpumesh_data:/root/.gpumesh
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8732"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - GPUMESH_TOKEN=${GPUMESH_TOKEN:?set GPUMESH_TOKEN, e.g. GPUMESH_TOKEN=mysecret docker compose up -d}
      - GPUMESH_COLOR=1
    # The coordinator URL is a required positional argument — `join` alone
    # exits with "the following arguments are required: url", so every worker
    # would crash on startup. --token is omitted deliberately: `join` does
    # read GPUMESH_TOKEN from the environment.
    command: join http://coordinator:8732 --color
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

volumes:
  gpumesh_data:
