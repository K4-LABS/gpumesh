# Coordinator + N workers.
#
#     GPUMESH_TOKEN=mysecret docker compose up -d
#
# Both services read GPUMESH_TOKEN from the environment. `:?` fails the run
# with a readable message when it is unset, instead of starting a coordinator
# with a random token that no worker could ever authenticate against.
#
# This uses the published image so the file works on its own. To test local
# changes instead, replace `image:` with `build: .` in both services.
services:
  coordinator:
    image: samurai007ak/gpumesh:latest
    ports:
      - "${GPUMESH_PORT:-8732}:8732"
      - "48900:48900/udp"
    environment:
      - GPUMESH_TOKEN=${GPUMESH_TOKEN:?set GPUMESH_TOKEN, e.g. GPUMESH_TOKEN=mysecret docker compose up -d}
      - GPUMESH_COLOR=1
    command: serve --port 8732 --color
    volumes:
      - gpumesh_data:/root/.gpumesh
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8732"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    image: samurai007ak/gpumesh:latest
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - GPUMESH_TOKEN=${GPUMESH_TOKEN:?set GPUMESH_TOKEN, e.g. GPUMESH_TOKEN=mysecret docker compose up -d}
      - GPUMESH_COLOR=1
    # The coordinator URL is a required positional argument — `join` on its
    # own exits with "the following arguments are required: url".
    command: join http://coordinator:8732 --color
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

volumes:
  gpumesh_data:
